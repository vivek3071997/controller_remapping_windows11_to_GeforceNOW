name: Build Windows Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build standalone Windows Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "ApexControllerRemapper" `
          --add-data "constants.py;." `
          --add-data "profiles.py;." `
          --add-data "engine.py;." `
          --add-data "hidhide.py;." `
          --add-data "ui.py;." `
          witcher_remapper.py

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ApexControllerRemapper-Windows
        path: dist/ApexControllerRemapper/
